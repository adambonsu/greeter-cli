plugins:
  - rubocop-rspec

# Merge our Exclude list with RuboCop's defaults (which exclude vendor/,
# node_modules/, etc.) instead of replacing them. Without this, adding any
# AllCops/Exclude entry drops the built-in excludes, so CI's bundler-cache
# install into vendor/bundle would get linted.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/security-scan'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "features/**/*"

Metrics/ModuleLength:
  Exclude:
    - "spec/security/**/*"

# ---------------------------------------------------------------------------
# RSpec cops
#
# This project uses an intentional spec layout (spec/unit, spec/security)
# that diverges from rubocop-rspec's default class-mirroring convention, plus
# a cross-cutting security suite that describes behaviours rather than a single
# class. The settings below keep the cops meaningful for ordinary unit specs
# while not fighting that structure. (The domain latency benchmark now lives in
# the greeter-core gem.)
# ---------------------------------------------------------------------------

# Our unit specs live under spec/unit/... rather than spec/greeter/...,
# so the class-path-mirroring check does not apply.
RSpec/SpecFilePathFormat:
  Enabled: false

# Security specs describe behaviours/scenarios, not one class.
RSpec/DescribeClass:
  Exclude:
    - "spec/security/**/*"

# Security examples are inherently multi-step.
RSpec/ExampleLength:
  Exclude:
    - "spec/security/**/*"

RSpec/MultipleExpectations:
  Exclude:
    - "spec/security/**/*"
    - "spec/unit/adapters/system_clock_spec.rb"

# The security suite generates examples in a loop from source-file paths;
# the "leaked" locals are the parameterisation mechanism, not test state.
RSpec/LeakyLocalVariable:
  Exclude:
    - "spec/security/**/*"


