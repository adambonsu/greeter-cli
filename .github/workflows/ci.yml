# .github/workflows/ci.yml
#
# Jobs
# ────
#  spec      – RSpec + SimpleCov HTML artifact          ┐
#  bdd       – Cucumber + traceability.json artifact     │ parallel
#  lint      – RuboCop                                   │
#  security  – Brakeman + bundler-audit                  ┘
#  perf      – greeting_bench.rb (needs: spec)
#  spec-gate – openspec validate (independent, blocks merge)
#  release   – on v* tags only: package versioned CLI tarball + GitHub Release
#              (needs: all of the above)

name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_JOBS: 4
  BUNDLE_RETRY: 3
  # Single source of truth for the Ruby toolchain across all jobs.
  RUBY_VERSION: "3.3.5"
  BUNDLER_VERSION: "2.5.23"

# ─────────────────────────────────────────────────────────────────────────────
# spec
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  spec:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run RSpec
        run: bundle exec rspec --format progress --format html --out coverage/rspec.html

      - name: Upload SimpleCov HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simplecov-report
          path: coverage/
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# bdd
# ─────────────────────────────────────────────────────────────────────────────
  bdd:
    name: Cucumber BDD
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Create tmp directory
        run: mkdir -p tmp

      - name: Run Cucumber
        run: bundle exec cucumber --format progress

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: traceability-report
          path: tmp/traceability.json
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# lint
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github \
            --debug

# ─────────────────────────────────────────────────────────────────────────────
# security
# ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager -q -w2 --force

      - name: bundler-audit CVE check
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

# ─────────────────────────────────────────────────────────────────────────────
# perf  (gated on spec passing)
# ─────────────────────────────────────────────────────────────────────────────
  perf:
    name: Performance benchmark
    runs-on: ubuntu-latest
    needs: spec

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # Restore a branch-scoped baseline so regression checks fire on
      # subsequent pushes to the same branch.  The cache is written back
      # automatically by actions/cache when the key is new.
      - name: Restore perf baseline cache
        uses: actions/cache@v5
        with:
          path: perf/baseline.json
          # Key includes the branch so each branch tracks its own baseline.
          # Changing the key suffix busts the cache intentionally.
          key: perf-baseline-${{ github.ref_name }}-v1
          restore-keys: |
            perf-baseline-${{ github.ref_name }}-

      - name: Run benchmark (fails on regression or budget breach)
        run: bundle exec ruby perf/greeting_bench.rb

# ─────────────────────────────────────────────────────────────────────────────
# spec-gate  (OpenSpec structural validation — blocks merge if malformed)
# ─────────────────────────────────────────────────────────────────────────────
  spec-gate:
    name: OpenSpec validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec

      - name: Validate all OpenSpec changes
        run: openspec validate --all --strict --json --no-interactive

# ─────────────────────────────────────────────────────────────────────────────
# release  (v* tags only — runs only if every other job passed)
#
# greeter is a Ruby CLI, not a compiled binary: exe/greeter requires the
# greeter-core gem and the app's adapters at runtime. So the "versioned exe" we
# ship is a self-contained distribution tarball (exe/ + lib/ + Gemfile[.lock]),
# which a user unpacks and runs with `bundle install && bundle exec exe/greeter`.
# The tarball is attached to a GitHub Release, giving a durable, public,
# downloadable, version-named asset (unlike CI artifacts, which expire and
# require sign-in).
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release CLI
    runs-on: ubuntu-latest
    # Gate: only when all validation jobs pass...
    needs: [spec, bdd, lint, security, perf, spec-gate]
    # ...and only for version tags (never on branch or PR builds).
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # required to create the Release and upload assets

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # Fail early if the CLI can't even boot with the released dependencies.
      # Also exercises the --version flag end-to-end.
      - name: Smoke-test the CLI
        run: |
          out="$(bundle exec ruby exe/greeter "Alice")"
          test "$out" = "Hello, Alice!" || { echo "unexpected output: $out"; exit 1; }
          bundle exec ruby exe/greeter --version

      # The exact greeter-core version this build resolved to is recorded in
      # Gemfile.lock — the authoritative source. Expose it for the release notes
      # so the CLI↔core pairing is discoverable without decoding the tag.
      - name: Resolve bundled greeter-core version
        id: core
        run: |
          core_version="$(bundle exec ruby -e 'require "greeter/core"; print Greeter::Core::VERSION')"
          echo "version=${core_version}" >> "$GITHUB_OUTPUT"

      - name: Package versioned CLI tarball
        run: |
          version="${GITHUB_REF_NAME}"
          pkg="greeter-cli-${version}"
          mkdir -p "dist/${pkg}"
          # Ship the runnable distribution: the executable, the app's adapter
          # code, and the pinned dependency manifest.
          cp -r exe lib Gemfile Gemfile.lock README.md LICENSE "dist/${pkg}/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          # Checksum so downloaders can verify integrity.
          ( cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          ls -l dist

      - name: Create GitHub Release and upload the CLI
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greeter-cli-${{ github.ref_name }}.tar.gz
            dist/greeter-cli-${{ github.ref_name }}.tar.gz.sha256
          # Prepended above the auto-generated notes: records which greeter-core
          # this CLI release was built against.
          body: |
            **greeter-cli ${{ github.ref_name }}** — built against **greeter-core ${{ steps.core.outputs.version }}**.

            Run `greeter --version` to confirm the pairing. The exact pinned dependency set is in the bundled `Gemfile.lock`.
          generate_release_notes: true
          fail_on_unmatched_files: true
